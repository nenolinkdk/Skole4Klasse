<!doctype html>
<html lang="da">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Skriv &amp; Lær – 4. klasse</title>
<link rel="stylesheet" href="faelles.css" />
</head>
<body>
<header>
  <h1>⭐ Skriv &amp; Lær ⭐</h1>
  <div class="pill">🌟 <span id="hud-stjerner">0</span></div>
  <div class="pill">🎁 <span id="hud-trofæer">0</span>/12</div>
  <button id="btn-status">📊 Status</button>
  <button id="btn-foraelder">👨‍👩‍👦 Forældre</button>
  <button id="btn-indstillinger">⚙️ Indstillinger</button>
</header>
<div class="hoved" id="app"></div>
<div class="overlay" id="overlay"><div class="indhold" id="overlay-indhold"></div></div>

<script src="faelles/data-dansk.js"></script>
<script src="faelles/data-andet.js"></script>
<script src="faelles/motor.js"></script>
<script>
"use strict";
var SIDE = [
 {fil:"laesning.html",ikon:"📖",navn:"Læsning & forståelse",tag:"Læs en tekst og svar på spørgsmål. Emner: natur, spil, videnskab, dagligdag, indkøb."},
 {fil:"stavning.html",ikon:"✏️",navn:"Stavning",tag:"Skriv ordene rigtigt. Laver du fejl, øver vi ordet igen, indtil du kan det."},
 {fil:"bogstaver.html",ikon:"🔤",navn:"Store & små bogstaver",tag:"Ret teksterne: navne, byer, sætningsstarter – alt skal have det rigtige bogstav."},
 {fil:"synonymer.html",ikon:"💬",navn:"Ordføråd & synonymer",tag:"Kan man sige det i stedet? Find ordet, der betyder næsten det samme."},
 {fil:"kreativ-skrivning.html",ikon:"🪄",navn:"Kreativ skrivning",tag:"Skriv dine egne historier med hjælp fra en ordbank. De gemmes i din historiebog."},
 {fil:"tegneserie.html",ikon:"🗣️",navn:"Tegneserie-bobler",tag:"Skriv talebobler til små tegneserier og gem din serie."},
 {fil:"matematik.html",ikon:"➗",navn:"Matematik",tag:"Regneopgaver, hvor du regner dig frem og samler stjerner. Fra plus og minus til brøker og decimaltal."},
 {fil:"nyheder.html",ikon:"📰",navn:"Nyheder for børn",tag:"Læs korte, rigtige nyheder og svar på spørgsmålene."},
 {fil:"ai.html",ikon:"🤖",navn:"Om AI",tag:"Hvad er kunstig intelligens? Korte tekster og quiz med forklaringer."}
];
var TILES = {"laesning.html":"laesning","stavning.html":"stavning","bogstaver.html":"bogstaver","synonymer.html":"synonym","matematik.html":"matematik","nyheder.html":"nyheder","ai.html":"ai"};
var app = document.getElementById("app");

/* ============ DASHBOARD ============ */
function totalMestrede(){ return ALLE_OMRAADER.reduce(function(a,o){ return a+S.områder[o].mestrede.length; },0); }
function bedsteNiveau(){ return Math.max.apply(null, ALLE_OMRAADER.map(function(o){ return S.områder[o].niveau; })); }
function tegnDashboard(){
  var navn = S.indstillinger.navn;
  var hilsen = navn? "Hej "+navn+"! 👋" : "Hej! 👋";
  var html = "<div class='kasse' style='background:linear-gradient(135deg,#eef4ff,#eafaf0)'>"+
    "<h2 style='margin-top:0'>"+hilsen+"</h2>"+
    "<div style='display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-top:10px'>"+
      "<div style='background:#fff;border-radius:12px;padding:12px;text-align:center'><h3>🌟 Stjerner</h3><div style='font-size:1.5rem'><b>"+S.stjerner+"</b></div>"+(S.stjerner?"":"<div class='tagline'>Klø på!</div>")+"</div>"+
      "<div style='background:#fff;border-radius:12px;padding:12px;text-align:center'><h3>🎁 Trofæer</h3><div style='font-size:1.2rem'>"+("🏅".repeat(S.trofæer)||"Ingen endnu")+"</div></div>"+
      "<div style='background:#fff;border-radius:12px;padding:12px;text-align:center'><h3>✅ Mestrede opgaver</h3><div style='font-size:1.5rem'><b>"+totalMestrede()+"</b></div></div>"+
      "<div style='background:#fff;border-radius:12px;padding:12px;text-align:center'><h3>🚀 Højeste niveau</h3><div style='font-size:1.2rem'>"+NIV[bedsteNiveau()].navn+"</div></div>"+
    "</div>"+
    "<p style='margin-bottom:0'><button class='btn grå' onclick='visIndstillinger()'>⚙️ Indstillinger</button>"+
    " <button class='btn blå' onclick='visStatus()'>📊 Status & historiebog</button></p>"+
  "</div>"+
  "<h2 style='text-align:center;color:#1d3557;margin-top:18px'>Vælg et område at træne 🚀</h2>"+
  "<div class='menu' id='menukort'></div>";
  return html;
}
app.innerHTML = tegnDashboard();
var m = document.getElementById("menukort");
SIDE.forEach(function(k){
  var el = document.createElement("a");
  el.className = "kort";
  el.href = k.fil;
  var prof = "";
  var omr = TILES[k.fil];
  if(omr){
    var oo=S.områder[omr];
    var pct = Math.min(100, Math.round(oo.mestrede.length/NIV[oo.niveau].behov*100));
    prof = "<div class='skridt'><i style='width:"+pct+"%'></i></div><div class='tagline'>Niveau "+oo.niveau+" ("+NIV[oo.niveau].navn+") · "+oo.mestrede.length+" mestrede opgaver</div>";
  } else {
    prof = "<div class='tagline'>🪄 Kreativt område – se historiebog under 📊 Status</div>";
  }
  el.innerHTML = "<div class='ikon'>"+k.ikon+"</div><h2>"+k.navn+"</h2><p>"+k.tag+"</p>"+prof;
  m.appendChild(el);
});
bindFællesknapper();
opdaterHUD();
</script>
</body>
</html>
